name: Build

# Builds the plugin and runs the unit tests on every push and pull request. A
# version tag (v*) also packages the plugin with yak and attaches the package
# to the tag's GitHub release, creating the release when none was posted yet.
# Publishing to the Rhino package server stays a manual step. The in-Rhino test
# suites need Rhino and do not run here.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build the plugin
        run: dotnet build src/FourFourView/FourFourView.csproj -c Release

      - name: Run the unit tests
        run: dotnet test tests/FourFourView.Fit.Tests/FourFourView.Fit.Tests.csproj

      - name: Upload the plugin
        uses: actions/upload-artifact@v4
        with:
          name: FourFourView-rhp
          path: |
            src/FourFourView/bin/Release/net8.0/FourFourView.rhp
            src/FourFourView/bin/Release/net8.0/FourFourView.deps.json
          if-no-files-found: error

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build the plugin
        run: dotnet build src/FourFourView/FourFourView.csproj -c Release

      - name: Assemble the package folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/misc | Out-Null
          Copy-Item src/FourFourView/bin/Release/net8.0/FourFourView.rhp, src/FourFourView/bin/Release/net8.0/FourFourView.deps.json dist/
          Copy-Item manifest.yml, docs/assets/icon.png dist/
          Copy-Item README.md dist/misc/README.md
          Copy-Item LICENSE dist/misc/LICENSE.txt

      - name: Download yak
        shell: pwsh
        run: Invoke-WebRequest https://files.mcneel.com/yak/tools/0.15.1/win-x64/yak.exe -OutFile yak.exe

      - name: Build the yak package
        shell: pwsh
        working-directory: dist
        run: '& ../yak.exe build'

      - name: Attach the package to a GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $package = Get-ChildItem dist -Filter *.yak | Select-Object -First 1
          if (-not $package) { throw "yak build produced no package" }
          $tag = $env:GITHUB_REF_NAME
          $prerelease = $tag -like '*-*'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            # A release posted for the tag already has its own notes: add the package to it.
            gh release upload $tag $package.FullName --clobber
            if ($LASTEXITCODE -ne 0) { throw "could not attach the package to release $tag" }
            if ($prerelease) {
              gh release edit $tag --prerelease
              if ($LASTEXITCODE -ne 0) { throw "could not mark release $tag as a prerelease" }
            }
          } else {
            $flags = @('--generate-notes')
            if ($prerelease) { $flags += '--prerelease' }
            gh release create $tag $package.FullName @flags
            if ($LASTEXITCODE -ne 0) { throw "could not create release $tag" }
          }
